---
docker_user: "{{ ansible_user | default(ansible_user_id) }}"

docker_apt_distribution: "{{ ansible_distribution | lower }}"

docker_apt_architecture: amd64

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

