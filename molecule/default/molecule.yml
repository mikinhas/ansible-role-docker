---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: virtualbox
platforms:
  - name: ansible-role-docker-jammy
    box: generic/ubuntu2204
    memory: 1024
    cpus: 1
  - name: ansible-role-docker-bookworm
    box: generic/debian12
    memory: 1024
    cpus: 1
provisioner:
  name: ansible
  env:
    ANSIBLE_LIBRARY: "${VIRTUAL_ENV}/lib/python3.14/site-packages/molecule_plugins/vagrant/modules"
verifier:
  name: testinfra
