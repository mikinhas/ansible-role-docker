---

- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Install prerequisites
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ docker_apt_distribution }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_architecture }}"
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true
    state: present

- name: Remove the legacy one-line Docker repository
  become: true
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/download_docker_com_linux_{{ item }}.list"
    state: absent
  loop:
    - ubuntu
    - debian

- name: Install Docker
  become: true
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Reset connection so docker group is picked up.
  ansible.builtin.meta: reset_connection

...
